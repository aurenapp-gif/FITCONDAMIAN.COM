<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;800&family=Inter:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

<style>
  html, body { background: #081521 !important; }
  html { overflow-x: clip; }
  #fcd-er { --fcd-sb: 0px; width: calc(100vw - var(--fcd-sb)); max-width: calc(100vw - var(--fcd-sb)); margin-left: calc(50% - 50vw + var(--fcd-sb) / 2) !important; margin-right: calc(50% - 50vw + var(--fcd-sb) / 2) !important; }
  .er-page { background: radial-gradient(120% 40% at 50% 0%, #12314b, #081521 55%); background-color: #081521; color: #eaf3fb; font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif; min-height: 100vh; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  .er-page *, .er-page *::before, .er-page *::after { box-sizing: border-box; }
  .er-page :where(h1, h2, h3, p) { margin: 0; }
  .er-logo { text-align: center; padding: 24px 20px 0; }
  .er-logo p { display: inline-block; text-align: left; font-family: "Sora", sans-serif; font-size: 22px; line-height: 1; letter-spacing: -0.05em; color: #fff; }
  .er-logo span { display: block; }
  .er-logo .t { font-weight: 300; }
  .er-logo .b { font-weight: 800; margin-top: 0.04em; }
  .er-logo i { font-style: normal; color: #35C2FF; }
  .er-footer { border-top: 1px solid rgba(255,255,255,0.08); padding: 26px 20px; text-align: center; color: #5a7183; font-size: 12px; }
  .er-footer a { color: #5a7183; text-decoration: none; }
</style>

<div id="fcd-er" class="er-page">
  <header class="er-logo"><p aria-label="Método RHS"><span class="t">método</span><span class="b">RHS<i>.</i></span></p></header>

  <div data-fcd="quiz" style="min-height:80vh"></div>

  <footer class="er-footer">© <span data-year></span> Fit con Damián · fitcondamian.com · <a href="https://fitcondamian.com/privacidad">Privacidad</a> · <a href="https://fitcondamian.com/politica-cookies">Cookies</a> · <a href="https://fitcondamian.com/aviso-legal">Aviso Legal</a></footer>
</div>

<script src="https://fitcondamian.com/fcd-quiz.js"></script>
<script>
(function () {
  var root = document.getElementById('fcd-er');
  if (!root) return;
  function fcdSb(){ root.style.setProperty('--fcd-sb', (window.innerWidth - document.documentElement.clientWidth) + 'px'); }
  fcdSb(); window.addEventListener('resize', fcdSb);
  root.querySelectorAll('[data-year]').forEach(function (y) { y.textContent = new Date().getFullYear(); });
})();
</script>

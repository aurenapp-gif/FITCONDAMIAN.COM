<script>
(function () {
  var root = document.getElementById('fcd-er'); if (!root) return;
  // Descontar la barra de desplazamiento (ordenadores con barra clásica) para que el ancho completo quede centrado
  function fcdSb(){ root.style.setProperty('--fcd-sb', (window.innerWidth - document.documentElement.clientWidth) + 'px'); }
  fcdSb(); window.addEventListener('resize', fcdSb);
  root.querySelectorAll('[data-year]').forEach(function (el) { el.textContent = new Date().getFullYear(); });

  // Reproductor de los vídeos de la línea de tiempo
  var vm = document.getElementById('er-vmodal'), vf = document.getElementById('er-vframe');
  function abrir(id) { vf.innerHTML = '<iframe src="https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&rel=0" title="Reproductor de vídeo" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>'; vm.style.display = 'flex'; }
  function cerrar() { vm.style.display = 'none'; vf.innerHTML = ''; }
  document.getElementById('er-vclose').addEventListener('click', cerrar);
  vm.addEventListener('click', function (e) { if (e.target === vm) cerrar(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') cerrar(); });
  function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  // Línea de tiempo
  var vsl = [{"id": "01", "titulo": "¿Qué es lo que te Está Restando Vitalidad y Atractivo?", "lado": "left", "youtube": "pUwfONeAbuk"}, {"id": "02", "titulo": "Cómo TRANSFORMAR tu físico de 40 años para volver a SENTIR QUE TIENES 25", "lado": "right", "youtube": "WFn9kDt3FsA"}, {"id": "03", "titulo": "Cómo ELIMINAR la flacidez a los 35 años: EL SECRETO DEL MÚSCULO", "lado": "left", "youtube": "0b7aIuPJaKo"}, {"id": "04", "titulo": "¿Estás Lista para Descubrir el Secreto de las Mujeres Jóvenes a los 40 Años?", "lado": "right", "youtube": "qZArQavUepk"}];
  var rows = document.getElementById('gr-tl-rows'), rowEls = [];
  vsl.forEach(function (v) {
    var row = document.createElement('div');
    row.className = 'gr-tl-row ' + v.lado;
    row.innerHTML = '<div class="gr-dot"></div><div class="gr-tl-card">' +
      '<button type="button" class="gr-tl-thumb" data-video="' + v.youtube + '" aria-label="Ver el vídeo: ' + esc(v.titulo) + '">' +
      '<img src="https://img.youtube.com/vi/' + v.youtube + '/maxresdefault.jpg" alt="" data-yt="' + v.youtube + '">' +
      '<span class="gr-tl-vol">VOL · ' + v.id + '</span><span class="gr-tl-play">▶</span></button>' +
      '<p>' + esc(v.titulo) + '</p></div>';
    rows.appendChild(row); rowEls.push(row);
  });
  rows.querySelectorAll('[data-video]').forEach(function (el) { el.addEventListener('click', function () { abrir(el.getAttribute('data-video')); }); });
  rows.querySelectorAll('img[data-yt]').forEach(function (img) { img.addEventListener('error', function () { if (!img.dataset.step) { img.dataset.step = '1'; img.src = 'https://img.youtube.com/vi/' + img.getAttribute('data-yt') + '/hqdefault.jpg'; } else { img.style.display = 'none'; } }); });

  // Estela de scroll: la línea se ilumina y las bolas se encienden al bajar
  var cont = document.getElementById('gr-tl'), fill = document.getElementById('gr-tl-fill'), dots = rows.querySelectorAll('.gr-dot'), raf = 0;
  function update() {
    raf = 0;
    var rect = cont.getBoundingClientRect(), ref = window.innerHeight * 0.5;
    fill.style.height = Math.max(0, Math.min(ref - rect.top, rect.height)) + 'px';
    rowEls.forEach(function (row, i) { dots[i].classList.toggle('on', row.getBoundingClientRect().top + 28 <= ref); });
  }
  function onScroll() { if (!raf) raf = requestAnimationFrame(update); }
  update();
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
})();
</script>
